const raw=[
['accommodate','loger, accueillir','v','Imagine une maison qui « accommode » ses invités en leur offrant un logement.','We can accommodate two guests.','Nous pouvons loger deux invités.'],
['ad','une petite annonce','n','Une « ad » est une annonce : pense à « advertisement », le mot long pour publicité.','I saw an ad online.','J’ai vu une petite annonce en ligne.'],
['advise','conseiller','v','« Advise » ressemble à « avis » : donner son avis, c’est conseiller.','Can you advise me?','Peux-tu me conseiller ?'],
['booming','en plein essor','adj','Imagine un grand « BOUM ! » : une activité explose et se développe rapidement.','Online shopping is booming.','Les achats en ligne sont en plein essor.'],
['brand-new','flambant neuf','adj','Une « brand » est une marque : imagine un produit tout neuf qui sort de sa boîte de marque.','This bike is brand-new.','Ce vélo est flambant neuf.'],
['buy','acheter','v','« Buy » sonne comme « bye » : dis bye-bye à ton argent quand tu achètes.','I want to buy a coat.','Je veux acheter un manteau.'],
['buyer','un acheteur','n','Un « buyer » est celui qui « buy » : celui qui achète.','The buyer paid the price.','L’acheteur a payé le prix.'],
['clothes / clothing','des vêtements','n','Imagine tes vêtements « close » (tout près) de ta peau : clothes !','These clothes are comfortable.','Ces vêtements sont confortables.'],
['consumption','la consommation','n','« Consumption » ressemble beaucoup à « consommation » : même idée !','We should reduce consumption.','Nous devrions réduire la consommation.'],
['crowded','bondé, noir de monde','adj','« Crowd » veut dire foule : un lieu crowded est rempli d’une foule.','The shop is crowded.','Le magasin est bondé.'],
['exchange','échanger','v','« Exchange » ressemble à « échange » : imagine deux personnes qui se passent un objet.','Can we exchange these items?','Pouvons-nous échanger ces objets ?'],
['expensive','cher','adj','Pense aux « dépenses » : un objet expensive te fait beaucoup dépenser.','This bag is expensive.','Ce sac est cher.'],
['fast','rapide','adj','Imagine une voiture de course « fast » qui file à toute vitesse.','This train is fast.','Ce train est rapide.'],
['free','gratuit','adj','Un cadeau « free » : tu repars librement sans payer un centime.','The tickets are free.','Les billets sont gratuits.'],
['green','vert, écologique','adj','Un objet « green » est aussi vert qu’une feuille : pense à la planète.','This is a green product.','C’est un produit écologique.'],
['habit','une habitude','n','« Habit » ressemble à « habitude » : deux mots presque jumeaux.','Recycling is a good habit.','Recycler est une bonne habitude.'],
['home owner','un propriétaire de maison','n','« Home » = maison ; « owner » = propriétaire : le propriétaire de la maison.','The home owner opened the door.','Le propriétaire de maison a ouvert la porte.'],
['item','un article, un objet','n','Imagine chaque item comme une ligne dans la liste de tes achats.','This item is on sale.','Cet article est en promotion.'],
['meeting','une réunion','n','« Meet » = rencontrer : un meeting rassemble des personnes.','We have a meeting today.','Nous avons une réunion aujourd’hui.'],
['price','un prix','n','« Price » ressemble à « prix » : imagine une étiquette de prix.','What is the price?','Quel est le prix ?'],
['queue up','faire la queue','v','« Queue » s’écrit comme « queue » en français : imagine une file en forme de queue.','We need to queue up.','Nous devons faire la queue.'],
['recycle','recycler','v','« Recycle » et « recycler » sont presque identiques : pense au symbole ♻️.','We recycle paper.','Nous recyclons le papier.'],
['second-hand',"d’occasion",'adj','« Second » = deuxième ; « hand » = main : un objet passé dans une deuxième main.','I bought a second-hand bike.','J’ai acheté un vélo d’occasion.'],
['set up','organiser','v','Imagine que tu « mets en place » (set up) les tables pour organiser un événement.','They set up a swap event.','Ils organisent un événement de troc.'],
['size','une taille','n','Pense à la « size » affichée sur l’étiquette d’un vêtement.','What size do you need?','De quelle taille as-tu besoin ?'],
['survey','une enquête','n','Imagine un « survey » : une série de questions pour sonder l’avis des gens.','We did a survey at school.','Nous avons fait une enquête à l’école.'],
['swap (verbe)','échanger, troquer','v','Imagine deux amis qui font « swap ! » et échangent leurs pulls.','We swap our clothes.','Nous échangeons nos vêtements.'],
['swap (nom)','un échange, un troc','n','Un « swap » est le moment où deux objets changent de mains.','The swap was successful.','Le troc a été réussi.'],
['try on','essayer (des vêtements)','v','« Try » = essayer ; « on » = sur soi : essaie le vêtement sur toi.','Can I try on this jacket?','Puis-je essayer cette veste ?'],
['wardrobe','une garde-robe','n','Dans « wardrobe », imagine une énorme robe gardée dans ton armoire.','My wardrobe is full.','Ma garde-robe est pleine.'],
['wear','porter (un vêtement)','v','« Wear » ressemble au début de « vêtement » à l’oreille : imagine que tu le portes.','I wear a blue shirt.','Je porte une chemise bleue.']
];
let words=raw.map((r,i)=>({id:i,en:r[0],fr:r[1],cat:r[2],mn:r[3],ex:r[4],exfr:r[5]}));const KEY='englishboost-unit2-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let data={records:{},xp:0,sessions:0,streakDates:[],theme:'light',customMn:{},gems:0,totalGems:0,combo:0,unlocked:[],gemFlashClaims:{},unlockedThemes:[],activeTheme:null,...saved};let page='home',mode='flash',queue=[],idx=0,answered=false,selected=[],matchState={},startTime=0,seconds=60,timer=null,sessionCorrect=0,sessionTotal=0,chosenMode='flash',currentAnswer='',letterOrder=[],letterPicked=[],showHint=false;

function availableUnits(){return UNIT_CATALOG.filter(u=>Array.isArray(u.words)&&u.words.length>0)}
function activeUnit(){return availableUnits().find(u=>u.id===selectedUnit)||availableUnits()[0]}
function unitWords(){return activeUnit().words}

function chooseUnit(id){let u=availableUnits().find(x=>x.id===id);if(!u)return;clearInterval(timer);selectedUnit=id;words=u.words;data.combo=0;persist();page='vocab';nav();render()}
function resetGems(){if(!confirm('Remettre uniquement ton solde de gemmes à 0 ? Tes achats et ta progression seront conservés.'))return;data.gems=0;persist();render();alert('Ton compteur de gemmes a été remis à zéro.')}
function resetLearning(kind){
 const title=unitTitle();
 const messages={
  discovered:`Remettre à zéro les mots découverts de ${title} ? Cela effacera également leur maîtrise et leur historique de réponses pour cette UNIT. Les gemmes, achats, astuces et XP seront conservés.`,
  mastered:`Remettre à zéro les mots maîtrisés de ${title} ? Les mots resteront découverts et leurs réponses précédentes seront conservées. Les gemmes, achats, astuces et XP seront conservés.`,
  xp:'Remettre tous les points XP à zéro ? Les mots découverts et maîtrisés, les gemmes, les achats et les astuces seront conservés.',
  all:`Remettre à zéro les mots découverts et maîtrisés de ${title}, ainsi que tous les XP ? Les gemmes, achats et astuces seront conservés.`
 };
 if(!Object.prototype.hasOwnProperty.call(messages,kind)||!confirm('⚠️ '+messages[kind]))return;
 if(kind==='discovered'||kind==='all'){
  for(const w of words)delete data.records[wordKey(w.id)];
  data.combo=0;
 }else if(kind==='mastered'){
  for(const w of words){const key=wordKey(w.id);if(data.records[key]){data.records[key].level=0;data.records[key].due=Date.now();}}
 }
 if(kind==='xp'||kind==='all')data.xp=0;
 persist();render();alert('Réinitialisation effectuée.');

function rec(id){return data.records[wordKey(id)]||{ok:0,bad:0,level:0,due:0}}function stats(){let mastered=words.filter(w=>rec(w.id).level>=4).length,review=words.filter(w=>rec(w.id).ok+rec(w.id).bad>0&&rec(w.id).due<=Date.now()&&rec(w.id).level<4).length,seen=words.filter(w=>rec(w.id).ok+rec(w.id).bad>0).length;return{mastered,review,seen}}function dateMark(){let d=new Date().toLocaleDateString('sv-SE');if(!data.streakDates.includes(d))data.streakDates.push(d)}function rate(id,kind){let r=rec(id);r.ok+=(kind==='good'?1:0);r.bad+=(kind==='bad'?1:0);r.level=kind==='good'?Math.min(5,r.level+1):kind==='mid'?Math.max(0,r.level-1):0;let mins=kind==='bad'?1:kind==='mid'?15:[0,10,60,1440,4320,10080][r.level];r.due=Date.now()+mins*60000;data.records[wordKey(id)]=r;data.xp+=kind==='good'?10:kind==='mid'?4:0;rewardAnswer(kind,id);if(stats().mastered===words.length&&!(data.unitMasteryBonuses||{})[selectedUnit]){data.unitMasteryBonuses??={};data.unitMasteryBonuses[selectedUnit]=true;awardGems(100,unitTitle()+' maîtrisée !')}dateMark();persist()}
function nav(){let n=[['home','🏠 Accueil'],['vocab','📚 Vocabulaire'],['practice','🎮 Exercices'],['review','🔁 Révisions'],['progress','📊 Statistiques'],['shop','💎 Boutique'],['settings','⚙️ Paramètres']];document.getElementById('nav').innerHTML=n.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){clearInterval(timer);page=p;nav();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let a=document.getElementById('app');if(page==='home')home(a);else if(page==='vocab')vocab(a);else if(page==='practice')practice(a);else if(page==='review')review(a);else if(page==='progress')progress(a);else if(page==='study')study(a);else if(page==='shop')shop(a);else if(page==='settings')settings(a)}function home(a){let s=stats();a.innerHTML=unitTabs()+`<section class="hero"><div><span class="pill">🇬🇧 ${esc(unitTitle().toUpperCase())}</span><h1>Apprends l’anglais<br>avec plaisir ✨</h1><p>${words.length} entrées à mémoriser grâce à des flashcards mnémotechniques, des jeux et des révisions intelligentes.</p><button class="primary" onclick="start('flash')">Commencer les flashcards →</button></div><div style="font-size:80px">🧠</div></section><div class="grid stats"><div class="card"><div class="muted">Mots découverts</div><div class="statnum">${s.seen}<span class="small muted"> / ${words.length}</span></div></div><div class="card"><div class="muted">Maîtrisés</div><div class="statnum">${s.mastered}</div></div><div class="card"><div class="muted">Points XP</div><div class="statnum">${data.xp}</div></div></div><div class="section"><h2>💎 Mes gemmes : ${data.gems}</h2><p class="muted">Gagne 5 gemmes par bonne réponse, et des bonus de série ! <button class="secondary" onclick="go('shop')">Voir la boutique</button></p></div><div class="section"><h2>🏆 Mes badges débloqués</h2><p class="muted">Tes badges favoris apparaissent en premier. Choisis jusqu’à trois favoris dans ta collection.</p></div><div class="card"><div c function review(a){let due=words.filter(w=>rec(w.id).due<=Date.now()&&rec(w.id).ok+rec(w.id).bad>0);a.innerHTML=unitTabs()+`<div class="section"><h2>🔁 Révision intelligente</h2><p class="muted">Les mots difficiles reviennent plus souvent. La répétition espacée est enregistrée automatiquement.</p></div><div class="card"><h3>${due.length} mot(s) à réviser maintenant</h3><p class="muted">${due.length?'Révise les mots arrivés à échéance.':'Aucune révision prévue pour le moment. Tu peux toujours t’entraîner !'}</p><button class="primary" onclick="start('flash',true)" ${!due.length?'disabled':''}>Réviser maintenant</button> <button class="secondary" onclick="start('flash')">Revoir tous les mots</button></div>`}function progress(a){let s=stats(),tot=Object.values(data.records).reduce((x,r)=>x+r.ok+r.bad,0),ok=Object.values(data.records).reduce((x,r)=>x+r.ok,0);a.innerHTML=unitTabs()+`<div class="section"><h2>📊 Mes statistiques</h2></div><div class="grid stats"><div class="card"><div class="muted">Maîtrisés</div><div class="statnum">${s.mastered}/31</div></div><div class="card"><div class="muted">Réponses correctes</div><div class="statnum">${ok}</div></div><div class="card"><div class="muted">Réussite</div><div class="statnum">${tot?Math.round(ok/tot*100):0}%</div></div><div class="card"><div class="muted">XP</div><div class="statnum">${data.xp}</div></div><div class="card"><div class="muted">Sessions</div><div class="statnum">${data.sessions}</div></div><div class="card"><div class="muted">Jours actifs</div><div class="statnum">${data.streakDates.length}</div></div></div><div class="card"><h3>Progression globale</h3><div class="bar"><div style="width:${s.mastered/words.length*100}%"></div></div><p class="muted">${s.seen} mots déjà rencontrés, ${s.mastered} maîtrisés.</p><button class="secondary" onclick="go('settings')">⚙️ Sauvegardes et paramètres</button></div>`}function resetData(){if(confirm('Effacer toute la progression et les astuces personnalisées ?')){data={records:{},xp:0,sessions:0,streakDates:[],theme:data.theme,customMn:{},gems:0,totalGems:0,combo:0,unlocked:[],gemFlashClaims:{},unlockedThemes:[],activeTheme:null};applyTheme();persist();render()}}function toggleDark(){if(data.activeTheme){data.activeTheme=null;data.theme='dark'}else data.theme=data.theme==='dark'?'light':'dark';applyTheme();persist()}applyTheme();function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m,dueOnly=false){words=unitWords();mode=m;chosenMode=m;queue=shuffle(dueOnly?words.filter(w=>rec(w.id).due<=Date.now()&&rec(w.id).ok+rec(w.id).bad>0):words);if(!queue.length)return;idx=0;sessionCorrect=0;sessionTotal=0;answered=false;selected=[];showHint=false;startTime=Date.now();seconds=60;page='study';nav();render();if(m==='challenge'){timer=setInterval(()=>{seconds--;let t=document.getElementById('countdown');if(t)t.textContent=seconds;if(seconds<=0)finish()},1000)}}function current(){return queue[idx%queue.length]}function study(a){if(mode==='match')return renderMatch(a);let w=current();let count=mode==='challenge'?`⏱️ <span id="countdown">${seconds}</span> s`:`${idx+1} / ${queue.length}`;a.innerHTML=`<div class="study"><div class="studyhead"><button class="secondary" onclick="go('practice')">← Quitter</button><b>${exs.find(x=>x[0]===mode)[2]}</b><span class="tag">${count}</span></div>${mode==='challenge'?'':`<div class="bar"><div style="width:${idx/queue.length*100}%"></div></div>`}<div id="activity"></div></div>`;let b=document.getElementById('activity');if(mode==='flash')flash(b,w);else if(['qcm','reverse','challenge'].includes(mode))qcm(b,w);else if(['writefr','writeen','dictation','sentence'].includes(mode))written(b,w);else if(mode==='letters')letters(b,w)}function flash(b,w){let mnemonic=mnemonicFor(w);let direction=flashDirection==='mixed'?(idx%2===0?'en':'fr'):flashDirection;let front=direction==='fr'?w.fr:w.en;let back=direction==='fr'?w.en:w.fr;b.innerHTML=`<div class="card" style="margin-bottom:12px"><label for="flashDirection">Sens des flashcards : </label><select id="flashDirection" onchange="setFlashDirection(this.value)"><option value="en" ${flashDirection==='en'?'selected':''}>Anglais → Français</option><option value="fr" ${flashDirection==='fr'?'selected':''}>Français → Anglais</option><option value="mixed" ${flashDirection==='mixed'?'selected':''}>Mixte</option></select></div><div class="flash"><span class="tag">${w.cat==='v'?'Verbe':w.cat==='n'?'Nom':'Adjectif'}</span>${!answered?`<h2>${esc(front)}</h2><p class="muted">${direction==='fr'?'Quel est le mot anglais ?':'Que signifie ce mot ?'}</p><button class="secondary" onclick="speak(${w.id})">🔊 Écouter</button><button class="primary" onclick="answered=true;render()">Voir la réponse ↻</button>`:`<div class="meaning">${esc(back)}</div><div class="mnemonic"><b>💡 Astuce mnémotechnique</b><p style="margin:8px 0 0">${esc(mnemonic)}</p></div><div class="example"><i>${esc(w.ex)}</i><br>${esc(w.exfr)}</div><div class="actions"><button class="secondary" onclick="speak(${w.id})">🔊 Écouter</button><button class="secondary" onclick="editMnemonic(${w.id})">✏️ Modifier l’astuce</button></div>`}</div>${answered?`<div class="actions"><button class="danger" onclick="flashRate('bad')">🔴 Je ne connais pas</button><button class="secondary" onclick="flashRate('mid')">🟠 J’hésite</button><button class="primary" onclick="flashRate('good')">🟢 Je connais</button></div>`:''}`}function editMnemonic(id){let old=mnemonicFor(words[id]);let v=prompt('Personnalise ton astuce mnémotechnique :',old);if(v!==null&&v.trim()){data.customMn[wordKey(id)]=v.trim();persist();render()}}function setFlashDirection(v){flashDirection=['en','fr','mixed'].includes(v)?v:'en';data.flashDirection=flashDirection;answered=false;persist();render()}function flashRate(kind){let w=current();let dir=flashDirection==='mixed'?(idx%2===0?'en':'fr'):flashDirection;data.flashDirections??={};let k=wordKey(w.id);data.flashDirections[k]??={en:{good:0,other:0},fr:{good:0,other:0}};data.flashDirections[k][dir][kind==='good'?'good':'other']++;rate(w.id,kind);sessionTotal++;if(kind==='good')sessionCorrect++;next()}function speak(id){if(!('speechSynthesis'in window)){alert('Synthèse vocale non disponible dans ce navigateur.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[id].en.replace(/ \((nom|verbe)\)/,''));u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}const VALIDATED_SYNONYMS={"accommodate":{"fr":["loger","accueillir","héberger","héberger des personnes"],"en":["accommodate","house","host"]},"ad":{"fr":["annonce","petite annonce","publicité","pub"],"en":["ad","advert","advertisement","classified ad"]},"advise":{"fr":["conseiller","donner des conseils","donner un conseil"],"en":["advise","give advice","counsel"]},"booming":{"fr":["en plein essor","en pleine expansion","florissant","en forte croissance"],"en":["booming","thriving","growing rapidly"]},"brand-new":{"fr":["flambant neuf","tout neuf","neuf","entièrement neuf"],"en":["brand-new","brand new","new","completely new"]},"buy":{"fr":["acheter","faire un achat","faire l achat","acquérir"],"en":["buy","purchase"]},"buyer":{"fr":["acheteur","acquéreur","client"],"en":["buyer","purchaser"]},"clothes / clothing":{"fr":["vêtements","habits","fringues","habillement"],"en":["clothes","clothing","garments"]},"consumption":{"fr":["consommation"],"en":["consumption"]},"crowded":{"fr":["bondé","noir de monde","plein de monde","très fréquenté","rempli de monde"],"en":["crowded","packed","full of people"]},"exchange":{"fr":["échanger","faire un échange","troquer"],"en":["exchange","swap","trade"]},"expensive":{"fr":["cher","coûteux","onéreux"],"en":["expensive","costly","pricey","dear"]},"fast":{"fr":["rapide","vite","à grande vitesse"],"en":["fast","quick","rapid","speedy"]},"free":{"fr":["gratuit","sans frais","sans payer"],"en":["free","free of charge","at no cost"]},"green":{"fr":["vert","écologique","respectueux de l environnement"],"en":["green","eco-friendly","environmentally friendly"]},"habit":{"fr":["habitude","routine"],"en":["habit","routine"]},"home owner":{"fr":["propriétaire de maison","propriétaire","propriétaire d une maison"],"en":["home owner","homeowner","house owner"]},"item":{"fr":["article","objet","produit","élément"],"en":["item","object","article","product"]},"meeting":{"fr":["réunion","rencontre","rendez-vous"],"en":["meeting","gathering"]},"price":{"fr":["prix","coût","tarif"],"en":["price","cost"]},"queue up":{"fr":["faire la queue","se mettre dans la file","se mettre en file","patienter dans la file"],"en":["queue up","line up","stand in line"]},"recycle":{"fr":["recycler"],"en":["recycle"]},"second-hand":{"fr":["d occasion","de seconde main","usagé","déjà utilisé"],"en":["second-hand","secondhand","used","pre-owned"]},"set up":{"fr":["organiser","mettre en place","préparer"],"en":["set up","organize","organise","arrange"]},"size":{"fr":["taille","dimension","pointure"],"en":["size"]},"survey":{"fr":["enquête","sondage","questionnaire"],"en":["survey","poll","questionnaire"]},"swap (verbe)":{"fr":["échanger","troquer","permuter"],"en":["swap","exchange","trade"]},"swap (nom)":{"fr":["échange","troc","permutation"],"en":["swap","exchange","trade"]},"try on":{"fr":["essayer","essayer des vêtements","faire un essayage"],"en":["try on"]},"wardrobe":{"fr":["garde robe","armoire à vêtements","penderie"],"en":["wardrobe","closet"]},"wear":{"fr":["porter","porter un vêtement","avoir sur soi"],"en":["wear","have on"]}};
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function stripArticle(s,lang){let t=norm(s);return lang==='fr'?t.replace(/^(?:un|une|des|le|la|les|l|du|de la|de l|d) /,''):t.replace(/^(?:a|an|the) /,'')}
function enbase(w){return w.en.replace(/ \((nom|verbe)\)$/,'')}
function approvedFor(w,dir){let base=VALIDATED_SYNONYMS[w.en]?.[dir]||[];let additions=data.approvedSynonyms?.[wordKey(w.id)]?.[dir]||[];return [...base,...additions]}
function accepted(w,direction){let baseline=direction==='en'?[enbase(w)]:w.fr.split(/,|\//).map(x=>x.trim());return [...baseline,...approvedFor(w,direction)]}
function isAccepted(w,dir,value){let ans=norm(value),without=stripArticle(value,dir);return accepted(w,dir).some(x=>norm(x)===ans||stripArticle(x,dir)===without)}
function suggestSynonym(id,dir,guess){let w=words.find(x=>String(x.id)===String(id));if(!w)return;let proposed=prompt('Proposer une traduction à examiner (elle ne sera PAS validée automatiquement) :',guess||'');if(!proposed||!proposed.trim())return;data.synonymSuggestions??=[];data.synonymSuggestions.push({unit:selectedUnit,id:w.id,word:w.en,direction:dir,proposal:proposed.trim(),status:'pending'});persist();alert('Proposition enregistrée. Elle doit être validée manuellement dans les paramètres avant d’être acceptée.')}
function reviewSuggestions(a){let proposals=(data.synonymSuggestions||[]).map((v,i)=>({...v,index:i})).filter(x=>x.status==='pending');a.innerHTML='<div class="section"><h2>📝 Synonymes proposés</h2><p class="muted">Les réponses proposées ne sont jamais acceptées automatiquement. Vérifie le sens dans le contexte du cours avant de les approuver.</p></div>'+ (proposals.length?proposals.map(x=>`<div class="card" style="margin:12px 0"><b>${esc(x.word)}</b> · ${x.direction==='fr'?'anglais → français':'français → anglais'}<p>Proposition : <b>${esc(x.proposal)}</b></p><div class="actions"><button class="primary" onclick="resolveSuggestion(${x.index},true)">Approuver après vérification</button><button class="secondary" onclick="resolveSuggestion(${x.index},false)">Refuser</button></div></div>`).join(''):'<div class="card">Aucune proposition en attente.</div>')+'<button class="secondary" onclick="go(\'settings\')">← Paramètres</button>'}
function resolveSuggestion(i,approve){let p=data.synonymSuggestions?.[i];if(!p||p.status!=='pending')return;if(approve&&!confirm('As-tu vérifié que cette traduction est correcte dans le contexte de l’UNIT ?'))return;p.status=approve?'approved':'rejected';if(approve){data.approvedSynonyms??={};let key=p.unit==='unit-2'?String(p.id):p.unit+':'+p.id;data.approvedSynonyms[key]??={fr:[],en:[]};if(!data.approvedSynonyms[key][p.direction].some(x=>norm(x)===norm(p.proposal)))data.approvedSynonyms[key][p.direction].push(p.proposal)}persist();reviewSuggestions(document.getElementById('app'))}
function distract(w,dir){let pool=shuffle(words.filter(x=>x.id!==w.id).map(x=>dir==='en'?enbase(x):x.fr));let arr=[dir==='en'?enbase(w):w.fr];for(let v of pool){if(!arr.some(x=>norm(x)===norm(v)))arr.push(v);if(arr.length===4)break}return shuffle(arr)}function qcm(b,w){let reverse=mode==='reverse';let correct=reverse?enbase(w):w.fr;let opts=distract(w,reverse?'en':'fr');b.innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><p class="muted">${reverse?'Quel est le mot anglais ?':'Quelle est la traduction française ?'}</p><h2 style="font-size:32px;color:#5c4bd5">${esc(reverse?w.fr:enbase(w))}</h2>${!reverse?`<button class="secondary" onclick="speak(${w.id})">🔊</button>`:''}</div><div class="choices">${opts.map((o,i)=>`<button class="choice" id="opt${i}" onclick="checkChoice(${i},${JSON.stringify(o).replace(/"/g,'&quot;')},${JSON.stringify(correct).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div><div id="feedback"></div>`}function checkChoice(i,choice,correct){if(answered)return;answered=true;let ok=norm(choice)===norm(correct);rate(current().id,ok?'good':'bad');sessionTotal++;if(ok)sessionCorrect++;document.querySelectorAll('.choice').forEach(el=>{el.disabled=true;if(norm(el.textContent)===norm(correct))el.classList.add('correct')});if(!ok)document.getElementById('opt'+i).classList.add('wrong');document.getElementById('feedback').innerHTML=`<div class="feedback">${ok?'✅ Bonne réponse !':'❌ Bonne réponse : <b>'+esc(correct)+'</b>'}</div><button class="primary" onclick="next()">Continuer →</button>`}function written(b,w){let dict=mode==='dictation',sent=mode==='sentence',fr=mode==='writefr';let expected=fr?w.fr:enbase(w);let phrase=w.ex;let blank=phrase.replace(new RegExp('\\b'+enbase(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'_____');if(sent&&blank===phrase){blank='Complète avec le mot correspondant à : '+w.fr}b.innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><p class="muted">${dict?'Écoute et écris le mot anglais':sent?'Complète la phrase en anglais':fr?'Traduis en français':'Traduis en anglais'}</p><h2 style="color:#5c4bd5">${esc(dict?'🔊 Mot à écouter':sent?blank:fr?enbase(w):w.fr)}</h2>${dict||fr?`<button class="secondary" onclick="speak(${w.id})">🔊 ${dict?'Écouter':'Prononciation'}</button>`:''}</div><form class="inputrow" onsubmit="event.preventDefault();checkWritten()"><input id="typed" autocomplete="off" placeholder="Ta réponse…" aria-label="Ta réponse" required><button class="primary" type="submit">Vérifier</button></form><div id="feedback"></div>`;if(dict)setTimeout(()=>speak(w.id),250);document.getElementById('typed').focus()}function checkWritten(){if(answered)return;let val=document.getElementById('typed').value;let w=current();let arr=accepted(w,mode==='writefr'?'fr':'en');let dir=mode==='writefr'?'fr':'en';let ok=isAccepted(w,dir,val);answered=true;rate(w.id,ok?'good':'bad');sessionTotal++;if(ok)sessionCorrect++;document.getElementById('feedback').innerHTML=`<div class="feedback">${ok?'✅ Bonne réponse !':'❌ La réponse attendue était : <b>'+esc(mode==='writefr'?w.fr:enbase(w))+'</b>'}<br><span class="muted">${esc(w.ex)} — ${esc(w.exfr)}</span>${ok?'':`<p><button class="secondary" onclick="suggestSynonym(${w.id},'${dir}',${JSON.stringify(val).replace(/"/g,'&quot;')})">Signaler une traduction correcte</button></p>`}</div><button class="primary" onclick="next()">Continuer →</button>`;document.getElementById('typed').disabled=true}
function letters(b,w){let target=enbase(w);letterOrder=shuffle([...target].filter(c=>c!==' '));letterPicked=[];b.innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><p class="muted">Remets les lettres dans l'ordre</p><h2>${esc(w.fr)}</h2><div class="answerline" id="answerline"></div><div class="letters" id="tiles"></div><div class="actions"><button class="secondary" onclick="letterPicked=[];drawTiles()">Effacer</button><button class="primary" id="validateLetters" onclick="checkLetters()">Vérifier</button></div><div id="feedback"></div></div>`;drawTiles()}function drawTiles(){document.getElementById('answerline').textContent=letterPicked.map(i=>letterOrder[i]).join('');document.getElementById('tiles').innerHTML=letterOrder.map((c,i)=>`<button class="tile" ${letterPicked.includes(i)?'disabled':''} onclick="letterPicked.push(${i});drawTiles()">${esc(c)}</button>`).join('')}function checkLetters(){if(answered)return;let w=current(),guess=letterPicked.map(i=>letterOrder[i]).join('');let ok=norm(guess)===norm(enbase(w).replace(/ /g,''));answered=true;rate(w.id,ok?'good':'bad');sessionTotal++;if(ok)sessionCorrect++;document.getElementById('feedback').innerHTML=`<div class="feedback">${ok?'✅ Bravo !':'❌ Réponse : <b>'+esc(enbase(w))+'</b>'}</div><button class="primary" onclick="next()">Continuer →</button>`}function renderMatch(a){let set=queue.slice(idx,idx+5);if(!set.length){finish();return}let left=shuffle(set),right=shuffle(set);matchState={left:null,right:null,done:new Set(),set};a.innerHTML=`<div class="study"><div class="studyhead"><button class="secondary" onclick="go('practice')">← Quitter</button><b>🧩 Associations</b><span class="tag">${Math.min(idx+5,queue.length)} / ${queue.length}</span></div><div class="card"><p class="muted">Clique sur un mot anglais, puis sur sa traduction.</p><div class="matchgrid"><div class="matchcol">${left.map(w=>`<button class="match" id="ml${w.id}" onclick="pickMatch('left',${w.id})">${esc(w.en)}</button>`).join('')}</div><div class="matchcol">${right.map(w=>`<button class="match" id="mr${w.id}" onclick="pickMatch('right',${w.id})">${esc(w.fr)}</button>`).join('')}</div></div><div id="matchFeedback" class="feedback hidden"></div></div></div>`}function pickMatch(side,id){if(matchState.done.has(id))return;matchState[side]=id;document.querySelectorAll('.match').forEach(x=>x.classList.remove('selected'));for(let s of ['left','right'])if(matchState[s]!==null)document.getElementById((s==='left'?'ml':'mr')+matchState[s]).classList.add('selected');if(matchState.left!==null&&matchState.right!==null){let ok=matchState.left===matchState.right;rate(matchState.left,ok?'good':'bad');sessionTotal++;if(ok){sessionCorrect++;matchState.done.add(id);for(let s of ['ml','mr']){let el=document.getElementById(s+id);el.classList.add('matched');el.disabled=true}}else{let f=document.getElementById('matchFeedback');f.classList.remove('hidden');f.textContent='Pas tout à fait ! Essaie une autre association.'}matchState.left=null;matchState.right=null;document.querySelectorAll('.match').forEach(x=>x.classList.remove('selected'));if(matchState.done.size===matchState.set.length){document.getElementById('matchFeedback').classList.remove('hidden');document.getElementById('matchFeedback').innerHTML=`🎉 Toutes les paires trouvées ! <button class="primary" onclick="idx+=${matchState.set.length};render()">Continuer →</button>`}}}function next(){answered=false;idx++;if(mode==='challenge'){if(seconds<=0){finish();return}if(idx>=queue.length){queue=shuffle(words);idx=0}}else if(idx>=queue.length){finish();return}render()}function finish(){clearInterval(timer);data.sessions++;if(sessionTotal>0){awardGems(15,'Session terminée');if(sessionCorrect===sessionTotal)awardGems(30,'Sans erreur !')}persist();let percent=sessionTotal?Math.round(sessionCorrect/sessionTotal*100):0;page='result';nav();document.getElementById('app').innerHTML=`<div class="study"><div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:65px">${percent>=75?'🏆':'🌟'}</div><h1>Session terminée !</h1><div class="statnum">${percent}%</div><p>${sessionCorrect} bonnes réponses sur ${sessionTotal} évaluations</p><p class="muted">Continue à pratiquer : chaque essai renforce ta mémoire.</p><div class="actions"><button class="primary" onclick="start('${chosenMode}')">Recommencer</button><button class="secondary" onclick="go('home')">Accueil</button></div></div></div>`}nav();render();
</script></body></html>
